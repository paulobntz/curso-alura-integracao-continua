services:
  postgres:
    image: "postgres"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=root
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    image: golang:1.22
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=root
      - DB_USER=root
      - DB_PASSWORD=root
    command:
      - go
      - run
      - main.go
    volumes:
      - ./:/app
    working_dir: /app
    ports:
      - 8080:8080
    depends_on:
      - postgres

volumes:
  postgres-data: